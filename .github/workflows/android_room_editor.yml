# Builds the phone room editor (android/room_editor, UI from tools/room_editor_web) as an APK and
# publishes it as a downloadable artifact, so the owner can install it from his phone.
#
# Manual run: Actions tab > "Room editor APK" > Run workflow (pick the branch).
# Pull requests and pushes to main that change the app or its UI build it too. The APK is signed with the committed
# android/room_editor/debug.keystore, so a new build installs over the old one and keeps its data.
name: Room editor APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/room_editor/**"
      - "tools/room_editor_web/**"
      - ".github/workflows/android_room_editor.yml"
  pull_request:
    paths:
      - "android/room_editor/**"
      - "tools/room_editor_web/**"
      - ".github/workflows/android_room_editor.yml"

concurrency:
  group: room-editor-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The runner image ships the Android SDK ($ANDROID_HOME).
      - name: Build the APK
        run: gradle -p android/room_editor --no-daemon assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: room-editor-apk
          path: android/room_editor/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # Installs the APK on an Android emulator, opens it and keeps the log and a screenshot, so a
  # crash on launch shows up here instead of on the owner's phone.
  launch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: room-editor-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell am start -W -n dev.pc360.roomeditor/.MainActivity
            sleep 20
            adb logcat -d > logcat.txt || true
            adb exec-out screencap -p > screen.png || true
            grep -E "AndroidRuntime|FATAL|dev.pc360|chromium|Console" logcat.txt | tail -200 || true
            adb shell pidof dev.pc360.roomeditor
            ! grep -q "FATAL EXCEPTION" logcat.txt

      - name: Keep the log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-editor-launch-api${{ matrix.api-level }}
          path: |
            logcat.txt
            screen.png
          if-no-files-found: ignore
          retention-days: 14
