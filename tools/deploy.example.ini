; Copy this file to deploy.local.ini (in the game folder, or at the root of the base) and fill it
; in. deploy.local.ini is in .gitignore: it holds the console's address and login, never commit it.
; Used by: python tools/deploy.py <game folder>   (docs/DEPLOY.md)

[console]
; The console's IP, as Aurora shows it. Aurora's FTP server must be enabled.
host = 192.168.0.20
port = 21
user = xboxftp
password = xboxftp
; Folder on the console. Empty: Hdd1:/Games/<identity from game.lua>.
target =

[xex]
; auto: WSL on Windows, the local shell on Linux. Also: wsl, native, skip (never build).
mode = auto
; WSL distribution to use; empty for the default one.
wsl_distro =
; Paths as the build shell sees them (inside WSL: Linux paths). ~ is the home folder.
xsdk = ~/xsdk
toolchain = ~/xsdk-gcc
build_type = RelWithDebInfo
; true: short log on the console (-DL360_RELEASE=ON).
release = false

[shaders]
; Folder with the xost tools (xsc.dll, glslang.exe, _xsc_native.py), Windows only.
; Empty: the shaders are not compiled and the last <game>/build/shaders is reused.
tools = C:\xost

[package]
; true: also write dist/<identity>.zip
zip = false

[launch]
; none: start the game from Aurora by hand. xbdm: start it after the upload through the xbdm.xex
; plugin (loaded by DashLaunch), which listens on TCP 730. Unverified on hardware.
method = none
port = 730
; Folder of default.xex as XBDM names it. Empty: derived from target (Hdd1:/Games/x -> Hdd:\Games\x).
path =
timeout = 10
