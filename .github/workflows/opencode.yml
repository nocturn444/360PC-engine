# Runs opencode (an AI coding agent) in the cloud when the owner comments `/opencode ...` or
# `/oc ...` on an issue or pull request, or from Actions > "opencode" > Run workflow.
# See docs/OPENCODE_CI.md.
#
# - Only the owner (nocturn444) can trigger it, so nobody else can spend the API key.
# - On an issue (or a manual run) opencode works on a new branch and opens a pull request.
#   On a pull request it commits to that pull request's branch. It never merges.
# - The agent itself may not run `git push`, `gh pr merge` and similar: pushing is done by the
#   action, always to a non-default branch.
# - The agent reads AGENTS.md (opencode loads it automatically, and the prompt reminds it).
#
# Secret: OPENCODE_API_KEY (key from opencode.ai/auth). Optional repository variable:
# OPENCODE_MODEL (default opencode-go/deepseek-v4.1-flash).
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "What opencode should do (it opens a PR with the result)"
        required: true

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  opencode:
    if: >-
      github.actor == 'nocturn444' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.comment.user.login == 'nocturn444' &&
        (startsWith(github.event.comment.body, '/opencode') || startsWith(github.event.comment.body, '/oc'))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENCODE_VERSION: "1.19.6"     # the opencode CLI release used (see "Install opencode")
    steps:
      - name: Check secret
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::Missing repository secret OPENCODE_API_KEY (see docs/OPENCODE_CI.md)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config --global user.name "opencode[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install LuaJIT for tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit

      # The steps of anomalyco/opencode/github (the action pinned at 2c14fc5 on 2026-11-21),
      # inlined: the action looks up the latest release with an unauthenticated call to the
      # GitHub API, which the shared runners hit the rate limit of, and then the whole run fails
      # before the agent starts (2026-11-24). Here the version is pinned instead (no API call),
      # the binary is cached, and the same `opencode github run` does the work. To update
      # opencode, change OPENCODE_VERSION.
      - name: Cache opencode
        id: opencode-cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENCODE_VERSION }}

      - name: Install opencode
        if: steps.opencode-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL https://opencode.ai/install | VERSION="$OPENCODE_VERSION" bash; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::opencode install failed"; exit 1; fi
            sleep $((attempt * 15))
          done
          "$HOME/.opencode/bin/opencode" --version
          "$HOME/.opencode/bin/opencode" --version | grep -q "$OPENCODE_VERSION" || { echo "::error::opencode is not $OPENCODE_VERSION"; exit 1; }

      - name: Add opencode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run opencode
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Rules are evaluated last-match-wins: allow everything, then deny the dangerous ones.
          OPENCODE_PERMISSION: >-
            {"bash": {"*": "allow",
                      "git push*": "deny", "git remote*": "deny", "git checkout main*": "deny",
                      "git switch main*": "deny", "git reset --hard*": "deny",
                      "gh *": "deny", "curl *api.github.com*": "deny"}}
          MODEL: ${{ vars.OPENCODE_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          AGENT: ""
          SHARE: "false"
          USE_GITHUB_TOKEN: "true"
          MENTIONS: /opencode,/oc
          VARIANT: ""
          OIDC_BASE_URL: ""
          PROMPT: >-
            ${{ github.event_name == 'workflow_dispatch' && format('Read AGENTS.md in full first and follow its rules. Run the tests it lists before finishing and report the results. Task from the owner: {0}', inputs.prompt) || '' }}
